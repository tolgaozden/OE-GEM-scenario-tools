# Report config: tables (and charts) from the run folder that run.yaml writes.
#
#   oegem --demo run run.yaml && oegem --demo report report.yaml    # offline, synthetic data
#   oegem report report.yaml                                        # after a real run
#
# The mnemonics and group codes are examples: check every one in your own catalogue
# (`oegem catalogue search <text>`).

title: Starter scenario report
input: outputs/starter             # the run folder (output.dir of run.yaml), relative to this file
baseline: baseline
scenarios: all                     # or a list of scenario names
groups: [US, CHINA, JAPAN]         # table rows; aggregates from groupings.yaml are added below them
aggregates: groupings.yaml
decimals: 2

variables:
  - indicator: GDP
    label: Real GDP growth
    quarterly: [yoy]               # chain for the quarterly tables (omit for none)
    annual: [annual_avg, yoy]      # chain for the annual tables (omit for none)
    deviation: abs                 # abs (difference, pp for rates) | pct (% of baseline) | none
  - indicator: CPI
    label: CPI inflation
    annual: [annual_avg, yoy]
    deviation: abs
  - indicator: RSH
    label: Short-term interest rate
    quarterly: [level]
    units: "%"

periods: {quarterly: "2026Q1:2028Q4", annual: "2026:2031"}    # quote ranges in YAML

outputs:
  dir: outputs/starter/report      # relative to this file
  xlsx: true
  csv: false
  markdown: true
  html: true
  charts: true                     # PDF chart book: paths, then deviations, per variable

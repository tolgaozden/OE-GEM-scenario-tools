[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oe-gem-scenario-tools"
version = "0.2.0"
description = "Toolkit for the Oxford Economics Global Economic Model web API: releases, catalogue, data, scenarios, solves, reports and model introspection"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.25",
    "numpy>=1.21",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "openpyxl>=3.0",
    "pyyaml>=5.4",
]
keywords = ["economics", "macroeconomic model", "scenario analysis", "forecasting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
tls = ["truststore>=0.8"]
dev = ["pytest>=7"]

[project.scripts]
oegem = "oegem.cli:main"

[tool.setuptools]
packages = ["oegem"]

[tool.setuptools.package-data]
oegem = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

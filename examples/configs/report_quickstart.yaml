# Report on the quick start run: GDP growth, CPI inflation and the short-term interest
# rate, in quarterly and annual tables, with one aggregate and a PDF chart book.
#
#   oegem --demo run examples/configs/run_quickstart.yaml
#   oegem --demo report examples/configs/report_quickstart.yaml
#
# input: is the run folder that run_quickstart.yaml writes; paths are relative to this
# file. The report reads results.csv and metadata.csv there and calls no API.
# Mnemonics and group codes are examples: check each in your own catalogue
# (`oegem catalogue search <text>`).

title: Quick start scenarios
input: ../../outputs/examples/quickstart
baseline: baseline
scenarios: all                     # or a list such as [oil_up_20, oil_and_rates]
groups: [US, CHINA, JAPAN]         # table rows; the aggregates below are added after them
aggregates: groupings.yaml         # weighted means of the members' transformed values
decimals: 2
mark_forecast: true                # quarterly headers after the history end get a trailing "f"

variables:
  - indicator: GDP
    label: Real GDP growth
    quarterly: [yoy]               # chain for the quarterly tables
    annual: [annual, yoy]          # `annual` uses each series' own annualization method
                                   # (sum, mean or end of year) from the run's metadata.csv
    deviation: abs                 # pp difference from baseline
  - indicator: CPI
    label: CPI inflation
    quarterly: [yoy]
    annual: [annual_avg, yoy]      # calendar-year average, then its growth rate
    deviation: abs
  - indicator: RSH
    label: Short-term interest rate
    quarterly: [level]
    annual: [annual_avg]
    units: "%"                     # marks a rate: differences are labelled pp
    deviation: abs

periods: {quarterly: "2026Q1:2028Q4", annual: "2026:2030"}   # quote ranges in YAML

outputs:
  dir: ../../outputs/examples/quickstart/report
  xlsx: true
  csv: true
  markdown: true
  html: true
  charts: true                     # report_charts.pdf: paths, then deviations, per variable

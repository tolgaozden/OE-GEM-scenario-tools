# Quick start run: three small scenarios against the newest 5-year release, small fetch.
#
#   oegem --demo run examples/configs/run_quickstart.yaml           # offline, synthetic numbers
#   oegem run examples/configs/run_quickstart.yaml --dry-run        # build and check, no solves
#   oegem run examples/configs/run_quickstart.yaml                  # real API (OE_TOKEN): 3 solves
#   oegem --demo report examples/configs/report_quickstart.yaml     # then the report
#
# Results go to outputs/examples/quickstart/ at the repository root (output.dir is
# relative to this file). With the real API the solved forecasts are created in your
# workspace under /me/oegem-examples/quickstart/.
#
# Mnemonics and group codes are examples: check each in your own catalogue
# (`oegem catalogue search <text>`). Shock sizes are illustrative round numbers.

run_name: quickstart
description: Oil price and US policy rate scenarios, on their own and together

model:
  release: latest:5yr            # or a release name, a full path or a forecast id (`oegem releases`)

solve:
  from: 2026Q3                   # keep the solve range inside the release's forecast horizon
  to: 2030Q4
  output_folder: /me/oegem-examples
  max_parallel: 1

fetch:
  indicators: [GDP, CPI, RSH, WPO_EQN]
  groups: [US, CHINA, JAPAN, WORLD]
  from: 2025Q1                   # a year before the report starts, so growth rates have their lags
  to: 2030Q4
  annual_fallback: true

scenarios:
  - name: oil_up_20
    description: World oil price 20% above baseline through 2027, fading out over 2028
    shocks:
      - {var: WPO_EQN:WORLD, type: pct, start: 2027Q1, profile: {kind: linear_fade, value: 20, hold: 4, fade: 4}}

  - name: us_rate_up_100bp
    description: US policy rate 100bp above baseline over 2027
    shocks:
      - {var: RFED:US, type: abs, start: 2027Q1, values: [1.0, 1.0, 1.0, 1.0]}

  - name: oil_and_rates
    description: Both shocks in one solve; compare it with the sum of the two legs
    include: [oil_up_20, us_rate_up_100bp]

output:
  dir: ../../outputs/examples/{run_name}
  formats: [csv, xlsx]

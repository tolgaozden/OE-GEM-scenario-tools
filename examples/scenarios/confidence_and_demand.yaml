# Confidence and demand scenarios.
#
#   oegem scenario validate examples/scenarios/confidence_and_demand.yaml
#   oegem scenario show examples/scenarios/confidence_and_demand.yaml
#
# Mnemonics in this file are examples: CONF_SHOCK (a confidence shock variable), WPO_EQN
# (world oil price) and C (private consumption). Check each one, and the groups, in your
# own catalogue (`oegem catalogue search confidence`). Whether a release has the
# confidence variable per economy or once for the world is something to look up there.
# Shock sizes are illustrative and in the shock variable's own units; see how the
# variable enters the equations before you size a shock:
#   oegem deps --groups US --indicator CONF_SHOCK --reverse

scenarios:
  - name: confidence_down_global
    description: Confidence falls in four large economies, peaks in mid-2027 and fades out by the end of 2028
    shocks:
      # hump(peak -1, up 2, hold 2, fade 4) = -0.5, -1, -1, -1, -0.75, -0.5, -0.25, 0
      # The YAML anchor (&hump) and aliases (*hump) reuse one profile for every economy.
      - {var: CONF_SHOCK:US, type: abs, start: 2027Q1, profile: &hump {kind: hump, peak: -1.0, up: 2, hold: 2, fade: 4}}
      - {var: CONF_SHOCK:EURO_11, type: abs, start: 2027Q1, profile: *hump}
      - {var: CONF_SHOCK:JAPAN, type: abs, start: 2027Q1, profile: *hump}
      - {var: CONF_SHOCK:CHINA, type: abs, start: 2027Q1, profile: *hump}

  - name: confidence_down_oil_fixed
    description: The same confidence shock with the oil price held on baseline, to isolate the demand channel
    include: [confidence_down_global]      # its commands come first, then the FIX below
    shocks:
      # Without this FIX the oil price can respond to weaker demand (if the release
      # models it). Comparing the two scenarios shows how much of the outcome runs
      # through the oil price.
      - {var: WPO_EQN:WORLD, type: fix, window: "2027Q1:2030Q4"}

  - name: india_consumption_residual
    description: Private consumption in India pushed down through its equation residual; it stays endogenous
    shocks:
      - var: C:INDIA
        type: residual                     # INCREASE &C:INDIA, no FIX
        start: 2027Q1
        profile: {kind: step, value: -0.01, n: 4}
        # -0.01 is in the units of the equation's residual. Check the residual type
        # first (`oegem equations --groups INDIA --indicators C`): for a multiplicative
        # residual use type residual_ratio with factors such as 0.99 instead.

# Combined scenarios and a decomposition set (legs + the joint scenario).
#
#   oegem scenario validate examples/scenarios/combined.yaml
#   oegem scenario show examples/scenarios/combined.yaml --name all_legs
#
# include: copies the commands of other scenarios, in order, ahead of the scenario's own
# commands. It sees the scenarios of this file and of files loaded before it: in a run
# config, the files listed earlier under `scenario_files`; with `oegem scenario validate`,
# the files named earlier on the command line. This file defines its own legs so that it
# also validates on its own:
#   * leg_oil loads the native command file with file:.
#   * leg_rates and leg_confidence restate, in a few lines, scenarios from
#     monetary_policy.yaml and confidence_and_demand.yaml.
#
# Decomposition: solve every leg on its own and all legs together (all_legs). The joint
# result minus the sum of the legs' effects is the interaction between the shocks.
# examples/06_report_and_charts.py runs that check with transforms.combine_marginals.
#
# Mnemonics are examples: WPO_EQN (oil price), RFED (US policy rate), CONF_SHOCK
# (confidence), GC (government consumption). Check each in your own catalogue
# (`oegem catalogue search`). Shock sizes are illustrative round numbers.

scenarios:
  # ---- legs -----------------------------------------------------------------------
  - name: leg_oil
    description: Oil price 20% above baseline through 2027, fading out over 2028 (read from the .3fs)
    file: ../3fs/oil_price_up_20.3fs       # relative to this file

  - name: leg_rates
    description: US policy rate 100bp above baseline over 2027 (as us_rate_up_100bp)
    shocks:
      - {var: RFED:US, type: abs, start: 2027Q1, values: [1.0, 1.0, 1.0, 1.0]}

  - name: leg_confidence
    description: Confidence down in the US and the euro area (a smaller confidence_down_global)
    shocks:
      - {var: CONF_SHOCK:US, type: abs, start: 2027Q1, profile: {kind: hump, peak: -1.0, up: 2, hold: 2, fade: 4}}
      - {var: CONF_SHOCK:EURO_11, type: abs, start: 2027Q1, profile: {kind: hump, peak: -1.0, up: 2, hold: 2, fade: 4}}

  # ---- combinations ---------------------------------------------------------------
  - name: oil_and_rates
    description: The oil shock and the US rate rise in one solve
    include: [leg_oil, leg_rates]

  - name: all_legs
    description: All three legs in one solve, the joint run of the decomposition set
    include: [leg_oil, leg_rates, leg_confidence]

  - name: oil_with_fiscal_support
    description: The oil shock plus a temporary rise in US government consumption
    include: [leg_oil]                     # included commands first, then the shocks below
    shocks:
      - {var: GC:US, type: pct, start: 2027Q2, values: [1, 1, 1, 1]}
